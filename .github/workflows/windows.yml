name: Windows

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - '.github/workflows/windows.yml'

jobs:
  package:
    name: Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package Sample App
        shell: bash
        run: ./gradlew :sample:composeApp:packageMsi :sample:composeApp:packageExe

      - name: Print jpackage Logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in sample/composeApp/build/compose/logs/*/*.txt; do
            echo "::group::${log}"
            cat "${log}"
            echo "::endgroup::"
          done
